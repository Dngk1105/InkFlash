<!DOCTYPE html>
<!-- Thiết kế: docs/design/display/display.md -->
<!-- Dữ liệu đổi dạng qua từng tầng của đường vẽ màn, vẽ từ display.md (phần "Ý định vẽ", "Một thao tác vẽ",
     "Trạng thái của từng điểm", "Nhiệt độ", "Hợp đồng driver màn", "Profile bảng sóng"). SVG dựng từ mảng STAGES;
     đổi đường vẽ màn thì sửa mảng cùng commit. -->
<html lang="vi" data-preset="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkFlash: dữ liệu qua đường vẽ màn</title>
<style>
    :root, [data-theme="light"] {
        --bg: #f2eee5; --grid: #d8d0c2; --panel: #fbf8f1; --panel-strong: #ede6d8; --panel-border: #c4b9a6;
        --panel-border-soft: #dcd4c5; --text: #242018; --text-muted: #6f6658; --accent: #9f403d; --accent-strong: #7d2a27;
        --accent-soft: #f4dcdb; --brand-teal: #287e84; --brand-bronze: #9a671f; --brand-purple: #765d86;
        --font-serif: "Newsreader", "Charter", "Cambria", "Georgia", serif; --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: "Cascadia Code", Consolas, monospace;
    }
    [data-theme="dark"] {
        --bg: #181611; --grid: #39342a; --panel: #231f18; --panel-strong: #2e2921; --panel-border: #625a4a;
        --panel-border-soft: #443e33; --text: #f4eddf; --text-muted: #b9ae9b; --accent: #cf6662; --accent-strong: #f4eddf;
        --accent-soft: #382424; --brand-teal: #7fc6c7; --brand-bronze: #d8ad68; --brand-purple: #c0a4d0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background-color: var(--bg); color: var(--text); font: 14px/1.45 var(--font-sans);
        background-image: repeating-linear-gradient(0deg, transparent 0, transparent 31px,
            color-mix(in srgb, var(--grid) 38%, transparent) 31px, color-mix(in srgb, var(--grid) 38%, transparent) 32px);
    }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 2px solid var(--panel-border); }
    header h1 { margin: 0; font: 600 21px var(--font-serif); color: var(--accent-strong); }
    header p { margin: 0; color: var(--text-muted); flex: 1 1 320px; }
    button { padding: 5px 12px; background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-radius: 3px; cursor: pointer; font: inherit; }
    main { padding: 16px; }
    .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 12px; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 900px; height: auto; }
    .stage { fill: var(--panel); stroke: var(--panel-border); }
    .stage.core { fill: var(--accent-soft); stroke: var(--accent); }
    .stage.hw { fill: var(--panel-strong); stroke: var(--brand-bronze); }
    .stage.side { fill: var(--panel); stroke: var(--brand-teal); stroke-dasharray: 4 3; }
    .layer { font: 600 11px var(--font-sans); fill: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .shape { font: 600 13px var(--font-mono); fill: var(--text); }
    .detail { font: 12px var(--font-sans); fill: var(--text-muted); }
    .flow { stroke: var(--accent); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .flow.side { stroke: var(--brand-teal); stroke-dasharray: 5 3; marker-end: url(#arrow-side); }
    .flow-text { font: 11.5px var(--font-sans); fill: var(--text); }
    .text-bg { fill: var(--panel); }
    #arrow path { fill: var(--accent); }
    #arrow-side path { fill: var(--brand-teal); }
</style>
</head>
<body>
<header>
    <h1>Dữ liệu qua đường vẽ màn</h1>
    <p>Từ khung 1 bit và ý định của app tới điện áp trên từng điểm. Cột phải: dữ liệu phụ đi vào ở từng tầng.</p>
    <button id="themeButton">Tối</button>
</header>
<main><div class="card"><svg id="diagram" role="img" aria-label="Sơ đồ luồng dữ liệu của đường vẽ màn"></svg></div></main>
<script>
/* ---- Nội dung ---- */

/* Mỗi tầng: lớp, dạng dữ liệu, chi tiết; side: dữ liệu phụ đi vào tầng đó (nếu có). */
const STAGES = [
    {layer: "app (task main)", shape: "khung 1 bit cả màn + ý định + cờ", detail: ["240 × 416, bit 1 = trắng, 12 480 byte; ý định AUTO/TEXT/UI/PAGE; cờ hoãn dọn, trước khi ngủ"],
        side: {shape: "press_ms", detail: ["mốc đo từ lúc bấm"]}},
    {layer: "frame_slots", shape: "khung mới nhất trong hàng chờ", detail: ["3 khung trong RAM nội; khung giữa bị bỏ; ý định đi theo khung"]},
    {layer: "display_policy", kind: "core", shape: "vùng đổi + byte trạng thái từng điểm", detail: ["so với khung đang hiện → hình chữ nhật, mép x căn 8",
        "mỗi điểm 1 byte trong PSRAM: cờ viền 2 bit, nợ xám 4 bit"], side: {shape: "config", detail: ["trọng số, ngưỡng nợ, trần co giãn,", "edge_ms, light_ms, strong_ms"]}},
    {layer: "display_policy", kind: "core", shape: "quyết định: việc, ý định, window, mặt phẳng cũ", detail: ["vẽ preset (cũ = khung đang hiện) hoặc dọn cả màn (cũ = mới đảo bit)",
        "khi nghỉ: dọn tâm, quanh viền, nhẹ (cũ = khung đang hiện, đảo bit ở điểm được chọn)"]},
    {layer: "ink_display", shape: "(mặt phẳng mới, mặt phẳng cũ) + window", detail: ["hai con trỏ tới cả khung trong RAM nội; mặt phẳng cũ dựng riêng khi cần đảo bit"]},
    {layer: "ink_display", shape: "mục đích → preset → index profile + cfg", detail: ["dải nhiệt độ → id profile → index trong bảng khả năng; id không còn thì mặc định của driver",
        "cfg: vào chế độ partial, PT_SCAN, kéo viền màn"], side: {shape: "nhiệt độ", detail: ["đọc 0x40 trước dọn mạnh, dọn nhanh;", "ngoài −10…60 °C thì bỏ"]}},
    {layer: "ink_drv_uc8253", shape: "profile: 5 bảng × 42 byte + điện áp + PLL", detail: ["chỉ gửi lại khi index khác lần trước (khoảng 270 byte)"],
        side: {shape: "ink_drv_uc8253_profiles.c", detail: ["sinh bằng tools/profile_gen.py", "từ profiles.json + bản dump OTP"]}},
    {layer: "ink_drv_uc8253", shape: "window cắt từ hai mặt phẳng → RAM 0x10, 0x13", detail: ["số DRF từ reset chẵn: mới → 0x13, cũ → 0x10; lẻ thì ngược lại",
        "PTL window (hoặc cả màn ngoài chế độ partial), CDI, PON nếu tắt, DRF × số lần quét"]},
    {layer: "UC8253", kind: "hw", shape: "cặp bit (mới, cũ) của từng điểm → 1 trong 4 bảng", detail: ["W→W: LUTWW · K→W: LUTKW · W→K: LUTWK · K→K: LUTKK"]},
    {layer: "panel", kind: "hw", shape: "điện áp theo từng khung: VSH, VSL, 0 V", detail: ["VSH kéo về đen, VSL kéo về trắng; DRF = (số khung + 2) / tần số khung"]},
];

/* ---- Vẽ ---- */

const SVG = "http://www.w3.org/2000/svg";
const MAIN_X = 20;
const MAIN_WIDTH = 640;
const SIDE_X = 720;
const SIDE_WIDTH = 300;
const LINE = 17;
const GAP = 30;

function add(parent, name, attributes, text) {
    const node = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attributes)) { node.setAttribute(key, value); }
    if (text !== undefined) { node.textContent = text; }
    parent.append(node);
    return node;
}

function card(svg, x, y, width, kind, layer, shape, detail) {
    const height = (layer ? 20 : 0) + 22 + detail.length * LINE + 10;
    add(svg, "rect", {class: `stage ${kind ?? ""}`, x, y, width, height, rx: 4});
    let line_y = y + 18;
    if (layer) {
        add(svg, "text", {class: "layer", x: x + 14, y: line_y}, layer);
        line_y += 20;
    }
    add(svg, "text", {class: "shape", x: x + 14, y: line_y}, shape);
    detail.forEach((text, index) => add(svg, "text", {class: "detail", x: x + 14, y: line_y + 20 + index * LINE}, text));
    return height;
}

function render() {
    const svg = document.getElementById("diagram");
    svg.replaceChildren();
    const defs = add(svg, "defs", {});
    for (const id of ["arrow", "arrow-side"]) {
        const marker = add(defs, "marker", {id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto"});
        add(marker, "path", {d: "M0,0 L10,5 L0,10 z"});
    }
    let y = 20;
    let previous_bottom = null;
    for (const stage of STAGES) {
        if (previous_bottom !== null) { add(svg, "path", {class: "flow", d: `M${MAIN_X + 80},${previous_bottom} L${MAIN_X + 80},${y}`}); }
        const height = card(svg, MAIN_X, y, MAIN_WIDTH, stage.kind, stage.layer, stage.shape, stage.detail);
        if (stage.side) {
            const side_height = card(svg, SIDE_X, y, SIDE_WIDTH, "side", null, stage.side.shape, stage.side.detail);
            const middle = y + Math.min(height, side_height) / 2;
            add(svg, "path", {class: "flow side", d: `M${SIDE_X},${middle} L${MAIN_X + MAIN_WIDTH + 2},${middle}`});
        }
        previous_bottom = y + height;
        y += height + GAP;
    }
    svg.setAttribute("viewBox", `0 0 ${SIDE_X + SIDE_WIDTH + 20} ${y}`);
}

/* ---- Theme ---- */

const button = document.getElementById("themeButton");
let saved = null;
try { saved = localStorage.getItem("inkflash-diagram-theme"); } catch { /* theo hệ điều hành */ }
function apply(theme) {
    document.documentElement.dataset.theme = theme;
    button.textContent = theme === "dark" ? "Sáng" : "Tối";
    try { localStorage.setItem("inkflash-diagram-theme", theme); } catch { /* chỉ mất lựa chọn lần sau */ }
}
apply(saved ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
button.addEventListener("click", () => apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
render();
</script>
</body>
</html>

<!DOCTYPE html>
<!-- Thiết kế: docs/design/display/display.md -->
<!-- Sơ đồ khối của đường vẽ màn, vẽ từ display.md (phần "Chia việc giữa display và driver", "Hợp đồng driver màn",
     "Danh sách profile nằm ở đâu"). Vẽ tay bằng SVG; đổi đường vẽ màn thì vẽ lại cùng commit. -->
<html lang="vi" data-preset="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkFlash: các khối của đường vẽ màn</title>
<style>
    :root, [data-theme="light"] {
        --bg: #f2eee5; --grid: #d8d0c2; --panel: #fbf8f1; --panel-strong: #ede6d8; --panel-border: #c4b9a6;
        --panel-border-soft: #dcd4c5; --text: #242018; --text-muted: #6f6658; --accent: #9f403d; --accent-strong: #7d2a27;
        --accent-soft: #f4dcdb; --brand-teal: #287e84; --brand-bronze: #9a671f; --brand-green: #397b53; --brand-purple: #765d86;
        --font-serif: "Newsreader", "Charter", "Cambria", "Georgia", serif; --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: "Cascadia Code", Consolas, monospace;
    }
    [data-theme="dark"] {
        --bg: #181611; --grid: #39342a; --panel: #231f18; --panel-strong: #2e2921; --panel-border: #625a4a;
        --panel-border-soft: #443e33; --text: #f4eddf; --text-muted: #b9ae9b; --accent: #cf6662; --accent-strong: #f4eddf;
        --accent-soft: #382424; --brand-teal: #7fc6c7; --brand-bronze: #d8ad68; --brand-green: #8fc29e; --brand-purple: #c0a4d0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background-color: var(--bg); color: var(--text); font: 14px/1.45 var(--font-sans);
        background-image: repeating-linear-gradient(0deg, transparent 0, transparent 31px,
            color-mix(in srgb, var(--grid) 38%, transparent) 31px, color-mix(in srgb, var(--grid) 38%, transparent) 32px);
    }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 2px solid var(--panel-border); }
    header h1 { margin: 0; font: 600 21px var(--font-serif); color: var(--accent-strong); }
    header p { margin: 0; color: var(--text-muted); flex: 1 1 320px; }
    button { padding: 5px 12px; background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-radius: 3px; cursor: pointer; font: inherit; }
    main { padding: 16px; }
    .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 12px; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 980px; height: auto; }
    .box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.2; }
    .group { fill: color-mix(in srgb, var(--panel-strong) 70%, transparent); stroke: var(--panel-border-soft); stroke-dasharray: 5 4; }
    .core { fill: var(--accent-soft); stroke: var(--accent); }
    .hw { fill: var(--panel-strong); stroke: var(--brand-bronze); }
    .tool { fill: var(--panel); stroke: var(--brand-purple); stroke-dasharray: 4 3; }
    .memory { fill: var(--panel); stroke: var(--brand-teal); }
    .title { font: 600 14px var(--font-serif); fill: var(--accent-strong); }
    .name { font: 600 13px var(--font-mono); fill: var(--text); }
    .note { font: 12px var(--font-sans); fill: var(--text-muted); }
    .label { font: 11.5px var(--font-sans); fill: var(--text); }
    .label-bg { fill: var(--bg); }
    .edge { stroke: var(--text-muted); stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .edge.call { stroke: var(--accent); }
    .edge.data { stroke: var(--brand-teal); stroke-dasharray: 5 3; }
    .edge.build { stroke: var(--brand-purple); stroke-dasharray: 3 3; }
    marker path { fill: var(--text-muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; color: var(--text-muted); font-size: 12px; }
    .legend span::before { content: ""; display: inline-block; width: 22px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 2px solid var(--text-muted); }
    .legend .call::before { border-color: var(--accent); }
    .legend .data::before { border-top-style: dashed; border-color: var(--brand-teal); }
    .legend .build::before { border-top-style: dotted; border-color: var(--brand-purple); }
</style>
</head>
<body>
<header>
    <h1>Các khối của đường vẽ màn</h1>
    <p>App giao khung kèm ý định; <code>display</code> chọn preset, giữ nợ và cờ viền từng điểm, dọn khi nghỉ; driver chỉ nạp profile được chỉ định và vẽ.</p>
    <button id="themeButton">Tối</button>
</header>
<main>
<div class="card">
<svg viewBox="0 0 1190 640" role="img" aria-label="Sơ đồ khối đường vẽ màn">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>

    <!-- Task main -->
    <rect class="group" x="20" y="20" width="300" height="250" rx="6"/>
    <text class="title" x="36" y="44">Task main</text>
    <rect class="box" x="40" y="60" width="260" height="70" rx="4"/>
    <text class="name" x="56" y="86">apps/ + ui</text>
    <text class="note" x="56" y="106">vẽ khung 1 bit cả màn</text>
    <text class="note" x="56" y="122">chọn ý định: TEXT, UI, PAGE, AUTO</text>
    <rect class="box" x="40" y="160" width="260" height="90" rx="4"/>
    <text class="name" x="56" y="186">system</text>
    <text class="note" x="56" y="206">cài đặt đã lưu (id profile, ngưỡng)</text>
    <text class="note" x="56" y="222">đi ngủ: màn nền với cờ "trước khi ngủ",</text>
    <text class="note" x="56" y="238">chờ báo vẽ xong và tắt nguồn</text>

    <!-- ink_display -->
    <rect class="group" x="380" y="20" width="440" height="420" rx="6"/>
    <text class="title" x="396" y="44">ink_display (task màn)</text>
    <rect class="box" x="400" y="60" width="400" height="74" rx="4"/>
    <text class="name" x="416" y="84">ink_display.c</text>
    <text class="note" x="416" y="104">preset theo mục đích: dải °C → id profile, cfg, trọng số</text>
    <text class="note" x="416" y="120">thang dọn khi nghỉ, tắt nguồn sau power_off_ms</text>
    <rect class="core" x="400" y="160" width="190" height="88" rx="4"/>
    <text class="name" x="414" y="184">frame_slots</text>
    <text class="note" x="414" y="204">chủ của 3 khung</text>
    <text class="note" x="414" y="220">C thuần, host test</text>
    <rect class="core" x="610" y="160" width="190" height="130" rx="4"/>
    <text class="name" x="624" y="184">display_policy</text>
    <text class="note" x="624" y="204">so khung, vùng đổi</text>
    <text class="note" x="624" y="220">nợ xám, cờ viền từng điểm</text>
    <text class="note" x="624" y="236">chọn cách vẽ, trần co giãn</text>
    <text class="note" x="624" y="252">thang dọn, mặt phẳng cũ</text>
    <text class="note" x="624" y="272">C thuần, host test</text>
    <rect class="memory" x="400" y="300" width="190" height="56" rx="4"/>
    <text class="name" x="414" y="322">RAM nội</text>
    <text class="note" x="414" y="342">3 khung + mặt phẳng cũ (DMA)</text>
    <rect class="memory" x="610" y="316" width="190" height="56" rx="4"/>
    <text class="name" x="624" y="338">PSRAM</text>
    <text class="note" x="624" y="358">1 byte/điểm: cờ 2 bit, nợ 4 bit</text>
    <text class="note" x="400" y="400">Ngủ sâu mất PSRAM: trước khi ngủ màn phải sạch.</text>
    <text class="note" x="400" y="418">Ghi flash tắt cache: task màn dừng tới khi ghi xong.</text>

    <!-- HAL, driver, controller -->
    <rect class="box" x="880" y="60" width="280" height="96" rx="4"/>
    <text class="name" x="896" y="84">ink_hal_display</text>
    <text class="note" x="896" y="104">draw(mới, cũ, window, profile, cfg)</text>
    <text class="note" x="896" y="120">power_off, read_temperature</text>
    <text class="note" x="896" y="136">khả năng: profile, mặc định theo mục đích</text>
    <rect class="box" x="880" y="200" width="280" height="130" rx="4"/>
    <text class="name" x="896" y="224">ink_drv_uc8253</text>
    <text class="note" x="896" y="244">REG = 1 mọi lần vẽ, không OTP</text>
    <text class="note" x="896" y="260">nạp lại bảng chỉ khi index đổi</text>
    <text class="note" x="896" y="276">ghi 0x10/0x13 theo chẵn lẻ DRF</text>
    <text class="note" x="896" y="292">không tự POF</text>
    <text class="note" x="896" y="308">PSR byte 2 = 0x0A (TIEG 0)</text>
    <rect class="hw" x="880" y="380" width="280" height="80" rx="4"/>
    <text class="name" x="896" y="404">UC8253 + panel 3,7"</text>
    <text class="note" x="896" y="424">cặp bit (mới, cũ) → LUTWW/KW/WK/KK</text>
    <text class="note" x="896" y="440">cảm biến nhiệt 0x40</text>

    <!-- profile -->
    <rect class="tool" x="380" y="520" width="300" height="100" rx="4"/>
    <text class="name" x="396" y="544">tools/profile_gen.py</text>
    <text class="note" x="396" y="564">nguồn: profiles.json + otp_bb0.hex</text>
    <text class="note" x="396" y="580">kiểm cân bằng điện tích, PLL, id</text>
    <text class="note" x="396" y="596">sinh file C</text>
    <rect class="tool" x="720" y="520" width="300" height="100" rx="4"/>
    <text class="name" x="736" y="544">ink_drv_uc8253_profiles.c</text>
    <text class="note" x="736" y="564">mảng const trong flash, không sửa tay</text>
    <text class="note" x="736" y="580">tr0–tr8, lut10f50, clean_*</text>
    <text class="note" x="736" y="596">id cố định, cài đặt lưu id</text>

    <!-- bsp -->
    <rect class="box" x="40" y="300" width="260" height="70" rx="4"/>
    <text class="name" x="56" y="326">ink_bsp</text>
    <text class="note" x="56" y="346">bảng chân, tạo driver</text>

    <!-- edges -->
    <path class="edge call" d="M300,95 L400,95"/>
    <rect class="label-bg" x="306" y="66" width="88" height="18"/><text class="label" x="310" y="79">acquire, submit</text>
    <path class="edge call" d="M300,205 C350,205 350,124 400,124"/>
    <rect class="label-bg" x="304" y="150" width="72" height="18"/><text class="label" x="306" y="163">set_options</text>
    <path class="edge data" d="M400,130 C360,160 340,210 300,228"/>
    <rect class="label-bg" x="314" y="236" width="62" height="18"/><text class="label" x="318" y="249">on_drawn</text>
    <path class="edge call" d="M495,134 L495,160"/>
    <path class="edge call" d="M705,134 L705,160"/>
    <path class="edge data" d="M705,290 L705,316"/>
    <path class="edge data" d="M495,248 L495,300"/>
    <path class="edge call" d="M800,96 L880,96"/>
    <rect class="label-bg" x="808" y="70" width="64" height="18"/><text class="label" x="812" y="83">draw, POF</text>
    <path class="edge call" d="M1020,156 L1020,200"/>
    <path class="edge call" d="M1020,330 L1020,380"/>
    <rect class="label-bg" x="1028" y="346" width="66" height="18"/><text class="label" x="1032" y="359">SPI, BUSY</text>
    <path class="edge build" d="M680,570 L720,570"/>
    <rect class="label-bg" x="684" y="544" width="32" height="18"/><text class="label" x="688" y="557">sinh</text>
    <path class="edge data" d="M864,520 L864,300 L880,300"/>
    <rect class="label-bg" x="770" y="490" width="88" height="18"/><text class="label" x="774" y="503">nạp theo index</text>
    <path class="edge call" d="M300,335 L350,335 L350,480 L848,480 L848,262 L880,262"/>
    <rect class="label-bg" x="420" y="471" width="32" height="18"/><text class="label" x="424" y="484">tạo</text>
</svg>
<div class="legend"><span class="call">gọi hàm</span><span class="data">dữ liệu, báo cáo</span><span class="build">sinh lúc build</span></div>
</div>
</main>
<script>
    const button = document.getElementById("themeButton");
    let saved = null;
    try { saved = localStorage.getItem("inkflash-diagram-theme"); } catch { /* theo hệ điều hành */ }
    const apply = (theme) => {
        document.documentElement.dataset.theme = theme;
        button.textContent = theme === "dark" ? "Sáng" : "Tối";
        try { localStorage.setItem("inkflash-diagram-theme", theme); } catch { /* chỉ mất lựa chọn lần sau */ }
    };
    apply(saved ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    button.addEventListener("click", () => apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
</script>
</body>
</html>

<!DOCTYPE html>
<!-- Thiết kế: docs/design/display/display.md -->
<!-- Một lần lật thẻ rồi thang dọn khi nghỉ, vẽ từ display.md (phần "Một lần vẽ đi qua đâu", "Giao khung", "Chọn cách vẽ",
     "Dọn khi nghỉ", "Hợp đồng driver màn"). SVG dựng từ mảng STEPS bên dưới; đổi đường vẽ màn thì sửa mảng cùng commit. -->
<html lang="vi" data-preset="editorial" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkFlash: một lần lật thẻ</title>
<style>
    :root, [data-theme="light"] {
        --bg: #f2eee5; --grid: #d8d0c2; --panel: #fbf8f1; --panel-strong: #ede6d8; --panel-border: #c4b9a6;
        --panel-border-soft: #dcd4c5; --text: #242018; --text-muted: #6f6658; --accent: #9f403d; --accent-strong: #7d2a27;
        --accent-soft: #f4dcdb; --brand-teal: #287e84; --brand-bronze: #9a671f; --brand-purple: #765d86;
        --font-serif: "Newsreader", "Charter", "Cambria", "Georgia", serif; --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: "Cascadia Code", Consolas, monospace;
    }
    [data-theme="dark"] {
        --bg: #181611; --grid: #39342a; --panel: #231f18; --panel-strong: #2e2921; --panel-border: #625a4a;
        --panel-border-soft: #443e33; --text: #f4eddf; --text-muted: #b9ae9b; --accent: #cf6662; --accent-strong: #f4eddf;
        --accent-soft: #382424; --brand-teal: #7fc6c7; --brand-bronze: #d8ad68; --brand-purple: #c0a4d0;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background-color: var(--bg); color: var(--text); font: 14px/1.45 var(--font-sans);
        background-image: repeating-linear-gradient(0deg, transparent 0, transparent 31px,
            color-mix(in srgb, var(--grid) 38%, transparent) 31px, color-mix(in srgb, var(--grid) 38%, transparent) 32px);
    }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 2px solid var(--panel-border); }
    header h1 { margin: 0; font: 600 21px var(--font-serif); color: var(--accent-strong); }
    header p { margin: 0; color: var(--text-muted); flex: 1 1 320px; }
    button { padding: 5px 12px; background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-radius: 3px; cursor: pointer; font: inherit; }
    main { padding: 16px; }
    .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 4px; padding: 12px; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1000px; height: auto; }
    .head { fill: var(--panel-strong); stroke: var(--panel-border); }
    .head-text { font: 600 13px var(--font-mono); fill: var(--text); text-anchor: middle; }
    .head-note { font: 11px var(--font-sans); fill: var(--text-muted); text-anchor: middle; }
    .life { stroke: var(--panel-border); stroke-dasharray: 4 4; }
    .message { stroke: var(--accent); stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .message.reply { stroke: var(--brand-teal); stroke-dasharray: 5 3; marker-end: url(#arrow-reply); }
    .message.self { stroke: var(--text-muted); }
    .message-text { font: 12px var(--font-sans); fill: var(--text); }
    .phase-band { fill: color-mix(in srgb, var(--brand-purple) 9%, transparent); }
    .phase-text { font: 600 12px var(--font-serif); fill: var(--brand-purple); }
    .text-bg { fill: var(--panel); }
    #arrow path { fill: var(--accent); }
    #arrow-reply path { fill: var(--brand-teal); }
</style>
</head>
<body>
<header>
    <h1>Một lần lật thẻ, rồi nghỉ</h1>
    <p>App giao khung kèm ý định UI; task màn vẽ vùng đổi bằng preset UI, đánh dấu cờ viền; nghỉ thì dọn tâm và quanh viền bằng DRF dưới 100 ms, rồi tắt nguồn.</p>
    <button id="themeButton">Tối</button>
</header>
<main><div class="card"><svg id="diagram" role="img" aria-label="Sơ đồ tuần tự một lần lật thẻ và thang dọn"></svg></div></main>
<script>
/* ---- Nội dung ---- */

const LANES = [
    {name: "app (task main)", note: "apps, ui"},
    {name: "ink_display", note: "task màn"},
    {name: "display_policy", note: "C thuần, PSRAM"},
    {name: "ink_drv_uc8253", note: "driver"},
    {name: "UC8253", note: "controller, panel"},
];

/* [từ, tới, chữ, kiểu] — kiểu: "call", "reply", "self"; hoặc {phase: chữ} để mở một đoạn. */
const STEPS = [
    {phase: "Lật thẻ"},
    [0, 0, "bấm → cử chỉ → intent; vẽ vào khung đã mượn (acquire)", "self"],
    [0, 1, "submit(khung, press_ms, UI, cờ) → notify", "call"],
    [1, 2, "decide(shown, next, {UI, cờ}, now)", "call"],
    [2, 2, "vùng đổi; trần co giãn; nợ + trọng số UI; cờ viền (4 kề cạnh, chống cụm)", "self"],
    [2, 1, "DRAW, ý định UI, window vùng đổi, mặt phẳng cũ = khung đang hiện", "reply"],
    [1, 1, "preset UI: dải nhiệt → id → index profile; cfg (PTL, PT_SCAN, viền)", "self"],
    [1, 3, "draw(mới, cũ, window, index, cfg)", "call"],
    [3, 4, "profile khác lần trước: PWR, VDCS, PLL, LUTOPT, 0x20–0x24", "call"],
    [3, 4, "DTM mới/cũ theo chẵn lẻ DRF, PTIN + PTL, CDI, PON nếu tắt, DRF", "call"],
    [4, 3, "BUSY lên", "reply"],
    [3, 1, "thời gian spi, panel, after (nguồn để bật)", "reply"],
    [1, 0, "on_drawn: vẽ, UI, id profile, nợ lớn nhất, số điểm có cờ", "reply"],
    {phase: "Nghỉ edge_ms (khung mới tới thì dừng thang, vẽ khung đó)"},
    [1, 2, "idle(now) → CLEAN_EDGE_CENTER", "call"],
    [1, 2, "cleanup_plane: mới = khung đang hiện, cũ đảo bit ở điểm có cờ", "call"],
    [1, 3, "draw(…, clean_full, window bao các cờ) — DRF dưới 100 ms", "call"],
    [3, 1, "xong", "reply"],
    [1, 2, "cleanup_done; idle → CLEAN_EDGE_NEIGHBOR; cleanup_plane (điểm kề cạnh tâm)", "call"],
    [1, 3, "draw(…, clean_edge) — DRF dưới 100 ms; rồi cleanup_done: xoá cờ", "call"],
    {phase: "Nghỉ power_off_ms không DRF"},
    [1, 3, "power_off", "call"],
    [3, 4, "POF", "call"],
    [1, 0, "on_drawn: tắt nguồn", "reply"],
    {phase: "Nghỉ light_ms, strong_ms"},
    [1, 1, "dọn nhẹ điểm có nợ ≥ debt_soft (clean_light); dọn mạnh cả màn, mặt phẳng cũ đảo bit, profile theo dải nhiệt", "self"],
];

/* ---- Vẽ ---- */

const SVG = "http://www.w3.org/2000/svg";
const LANE_WIDTH = 220;
const LEFT = 30;
const TOP = 20;
const HEAD_HEIGHT = 46;
const ROW = 34;
const PHASE = 30;

function add(parent, name, attributes, text) {
    const node = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attributes)) { node.setAttribute(key, value); }
    if (text !== undefined) { node.textContent = text; }
    parent.append(node);
    return node;
}

function lane_x(index) { return LEFT + LANE_WIDTH / 2 + index * LANE_WIDTH; }

function render() {
    const svg = document.getElementById("diagram");
    svg.replaceChildren();
    const defs = add(svg, "defs", {});
    for (const id of ["arrow", "arrow-reply"]) {
        const marker = add(defs, "marker", {id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto"});
        add(marker, "path", {d: "M0,0 L10,5 L0,10 z"});
    }
    let y = TOP + HEAD_HEIGHT + 20;
    const items = [];
    for (const step of STEPS) {
        if (!Array.isArray(step)) {
            items.push({phase: step.phase, y});
            y += PHASE;
            continue;
        }
        items.push({step, y});
        y += step[3] === "self" ? ROW + 6 : ROW;
    }
    const height = y + 20;
    const width = LEFT * 2 + LANE_WIDTH * LANES.length;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

    for (const item of items.filter((entry) => entry.phase)) {
        add(svg, "rect", {class: "phase-band", x: 10, y: item.y - 4, width: width - 20, height: PHASE - 6, rx: 3});
        add(svg, "text", {class: "phase-text", x: 18, y: item.y + 14}, item.phase);
    }
    LANES.forEach((lane, index) => {
        const x = lane_x(index);
        add(svg, "line", {class: "life", x1: x, y1: TOP + HEAD_HEIGHT, x2: x, y2: height - 10});
        add(svg, "rect", {class: "head", x: x - LANE_WIDTH / 2 + 14, y: TOP, width: LANE_WIDTH - 28, height: HEAD_HEIGHT, rx: 4});
        add(svg, "text", {class: "head-text", x, y: TOP + 20}, lane.name);
        add(svg, "text", {class: "head-note", x, y: TOP + 37}, lane.note);
    });
    for (const item of items.filter((entry) => entry.step)) {
        const [from, to, text, kind] = item.step;
        const message_y = item.y + 16;
        if (from === to) {
            const x = lane_x(from);
            add(svg, "path", {class: "message self", d: `M${x},${message_y - 6} h26 v12 h-24`, "marker-end": "url(#arrow)"});
            const label = add(svg, "text", {class: "message-text", x: x + 34, y: message_y + 4}, text);
            fit_label(svg, label, x + 34, width - 20);
            continue;
        }
        const x1 = lane_x(from);
        const x2 = lane_x(to);
        add(svg, "line", {class: `message ${kind === "reply" ? "reply" : ""}`, x1, y1: message_y, x2: x2 + (x2 > x1 ? -2 : 2), y2: message_y});
        const left = Math.min(x1, x2);
        const label = add(svg, "text", {class: "message-text", x: left + 8, y: message_y - 5}, text);
        fit_label(svg, label, left + 8, width - 20);
    }
}

/* Chữ dài hơn chỗ trống thì thu cỡ chữ; nền giấy sau chữ để không đè đường kẻ. */
function fit_label(svg, label, x, right) {
    let size = 12;
    while (label.getComputedTextLength() > right - x && size > 9) {
        size -= 0.5;
        label.style.fontSize = `${size}px`;
    }
    const box = label.getBBox();
    const background = document.createElementNS(SVG, "rect");
    Object.entries({class: "text-bg", x: box.x - 3, y: box.y - 1, width: box.width + 6, height: box.height + 2, rx: 2}).forEach(([key, value]) => background.setAttribute(key, value));
    svg.insertBefore(background, label);
}

/* ---- Theme ---- */

const button = document.getElementById("themeButton");
let saved = null;
try { saved = localStorage.getItem("inkflash-diagram-theme"); } catch { /* theo hệ điều hành */ }
function apply(theme) {
    document.documentElement.dataset.theme = theme;
    button.textContent = theme === "dark" ? "Sáng" : "Tối";
    try { localStorage.setItem("inkflash-diagram-theme", theme); } catch { /* chỉ mất lựa chọn lần sau */ }
}
apply(saved ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
button.addEventListener("click", () => apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
render();
</script>
</body>
</html>

# Từ điển thuật ngữ InkFlash.
#
# Luật:
# - `term` viết y nguyên trong code, comment, docs và chat. Không dịch.
# - `avoid` là cách gọi tiếng Việt cũ. `python tools/terms.py check` báo lỗi nếu gặp trong `scope`.
# - `id` cố định, không sửa. Script dùng `id` để ghép mục cũ với mục mới.
# - Thêm thuật ngữ mới vào đây trước khi dùng trong docs.
#
# Đổi tên: sửa thẳng file này, rồi chạy `python tools/terms.py rename` (so với bản ở HEAD, in diff).
# Duyệt diff xong thì chạy lại với `--apply`, commit file này cùng code trong một commit.
#
# | Sửa chỗ nào             | Script đổi gì                                                                 |
# |-------------------------|-------------------------------------------------------------------------------|
# | `modules[].prefix`      | mọi identifier `prefix_*` và `PREFIX_*`, tên file, thư mục, component, #include |
# | `terms[].term`          | chữ trong docs, comment; và phần chữ đó bên trong mỗi tên ở `symbols`          |
# | `terms[].symbols[i]`    | đúng identifier đó (ưu tiên hơn cách đổi suy ra từ `term`)                     |
#
# Ví dụ: term `take` -> `dequeue` thì `ink_frame_slots_take` -> `ink_frame_slots_dequeue`, chữ "take" trong docs
# cũng đổi. Field `take_us` không nằm trong `symbols` nên giữ nguyên.

# Thư mục/file được kiểm tra.
scope:
  - components/core/ink_frame_slots
  - components/core/ink_display_policy
  - components/ink_display
  - components/core/ink_gesture
  - components/core/ink_keymap
  - components/core/ink_ui
  - components/ink_input
  - components/ink_hal
  - components/drivers/ink_drv_uc8253
  - components/drivers/ink_drv_gpio_button
  - components/ink_bsp
  - components/ink_platform
  - components/ink_system
  - main
  - docs/architecture.md
  - docs/design
  - templates

# Prefix của từng component. Viết chữ thường; script tự đổi cả dạng CHỮ HOA (INK_FRAME_SLOTS_*).
# Prefix dài thắng prefix ngắn: đổi `ink_display` không đụng `ink_display_policy_*`.
modules:
  - id: frame_slots
    prefix: ink_frame_slots
    meaning: 'quản lý owner của 3 frame giữa main task và display task.'
  - id: display_policy
    prefix: ink_display_policy
    meaning: 'chọn decision cho mỗi frame, giữ debt và edge flag, lên lịch cleanup stage.'
  - id: display
    prefix: ink_display
    meaning: 'owner duy nhất của panel; chạy display task.'
  - id: hal_display
    prefix: ink_hal_display
    meaning: 'interface giữa display và driver màn.'
  - id: drv_uc8253
    prefix: ink_drv_uc8253
    meaning: 'driver controller UC8253 của panel WeAct 3,7".'
  - id: hal
    prefix: ink_hal
    meaning: 'header gộp các interface phần cứng (button, display).'
  - id: hal_button
    prefix: ink_hal_button
    meaning: 'interface giữa input và driver nút.'
  - id: drv_gpio_button
    prefix: ink_drv_gpio_button
    meaning: 'driver nút nối thẳng một chân GPIO, báo edge bằng interrupt.'
  - id: bsp
    prefix: ink_bsp
    meaning: 'pin map và driver của board; tạo device cho tầng trên.'
  - id: gesture
    prefix: ink_gesture
    meaning: 'core module: edge của nút -> gesture; debounce, state machine từng nút, deadline.'
  - id: keymap
    prefix: ink_keymap
    meaning: 'core module: gesture -> keymap intent theo scene table và app table; kiểm keymap table.'
  - id: input
    prefix: ink_input
    meaning: 'shell module của gesture: interrupt nút, timestamp, timer theo deadline, resync.'
  - id: platform
    prefix: ink_platform
    meaning: 'giờ (ms từ lúc boot) và one-shot timer trên esp_timer.'
  - id: system
    prefix: ink_system
    meaning: 'main queue và main task; chuyển message cho module owner; khởi động input và display.'
  - id: ui
    prefix: ink_ui
    meaning: 'core module: canvas 1 bit theo bố cục frame, vẽ hình và chữ UTF-8, font.'

terms:
  # ---- Task ----
  - id: display_task
    term: display task
    meaning: 'FreeRTOS task duy nhất gọi driver màn (ink_display.c).'
    avoid: [task màn]
  - id: main_task
    term: main task
    meaning: 'task chạy app; giữ mọi state, nhận message từ main queue, acquire frame, vẽ, submit frame.'
    avoid: [task main]
  - id: helper_task
    term: helper task
    meaning: 'task khác main task và display task, gồm task esp_timer của ESP-IDF; chỉ post message vào main queue, không sửa state của main task.'
    avoid: [task phụ]

  # ---- Frame và vòng đời (ink_frame_slots) ----
  - id: frame
    term: frame
    meaning: 'buffer 1 bit/pixel chứa ảnh full màn, nằm trong RAM nội. Có INK_FRAME_SLOTS_COUNT (3) frame.'
    avoid: [khung, khung đệm]
    symbols: [INK_DRV_UC8253_FRAME_BYTES]
  - id: acquire
    term: acquire
    meaning: 'main task mượn 1 frame free để vẽ.'
    avoid: [mượn khung]
    symbols: [ink_frame_slots_acquire, ink_display_acquire]
  - id: lease
    term: lease
    meaning: 'kết quả của acquire; gồm frame, fill, copy_from.'
    avoid: []
    symbols: [ink_frame_slots_lease_t]
  - id: submit
    term: submit
    meaning: 'main task đưa frame đã vẽ vào pending, không chờ.'
    avoid: [giao khung]
    symbols: [ink_frame_slots_submit, ink_display_submit]
  - id: pending
    term: pending
    meaning: 'frame đã submit, display task chưa take. Tối đa 1; submit đè thì frame cũ bị drop.'
    avoid: [hàng chờ]
  - id: take
    term: take
    meaning: 'display task lấy frame pending ra để vẽ.'
    avoid: [lấy khung]
    symbols: [ink_frame_slots_take]
  - id: shown_frame
    term: shown frame
    meaning: 'frame đang hiện trên panel.'
    avoid: [khung đang hiện]
    symbols: [ink_frame_slots_shown]
  - id: drop
    term: drop
    meaning: 'frame pending bị bỏ vì có frame mới hơn (đếm trong ink_frame_slots_dropped()); message bị bỏ vì main queue đầy.'
    avoid: [bị bỏ]
  - id: background_frame
    term: background frame
    meaning: 'ảnh vẽ lên panel trước deep sleep; sau wake coi là shown frame.'
    avoid: [màn nền]

  # ---- Policy (ink_display_policy) ----
  - id: intent
    term: intent
    meaning: 'lý do vẽ frame (AUTO, TEXT, UI, PAGE); policy dùng để chọn preset.'
    avoid: [ý định vẽ, ý định]
    symbols: [ink_display_policy_intent_t, ink_display_intent_t]
  - id: flag
    term: flag
    meaning: 'bit đi kèm frame khi submit (DEFER_CLEANUP, BEFORE_SLEEP).'
    avoid: [cờ đi kèm]
  - id: debt
    term: debt
    meaning: 'mức ghosting tích luỹ của 1 pixel, 0..INK_DISPLAY_POLICY_MAX_DEBT (15).'
    avoid: [nợ xám, nợ]
  - id: debt_ceiling
    term: debt ceiling
    meaning: 'mức debt tối đa trước khi policy bắt buộc cleanup.'
    avoid: [trần nợ]
  - id: edge_flag
    term: edge flag
    meaning: 'đánh dấu pixel nằm ở mép vùng đổi màu, cần cleanup edge.'
    avoid: [cờ viền]
  - id: changed_window
    term: changed window
    meaning: 'rect bao các pixel khác nhau giữa shown frame và frame mới; mép x căn theo x_align.'
    avoid: [vùng đổi]
  - id: cleanup
    term: cleanup
    meaning: 'lần vẽ không đổi ảnh, chỉ để xoá ghosting (CLEANUP_STRONG, CLEANUP_FAST, CLEAN_EDGE_*, CLEANUP_LIGHT).'
    avoid: [dọn màn, lượt dọn, dọn]
  - id: cleanup_stage
    term: cleanup stage
    meaning: 'một bậc cleanup khi idle (edge_ms, light_ms, strong_ms).'
    avoid: [thang dọn, bậc dọn]
  - id: idle
    term: idle
    meaning: 'khoảng không có frame mới; policy chạy các cleanup stage.'
    avoid: [lúc nghỉ, khi nghỉ]
  - id: active_period
    term: active period
    meaning: 'frame tới trong vòng active_ms sau frame trước: người dùng đang thao tác liên tục; debt ceiling tăng 1, vượt ceiling thì cleanup fast.'
    avoid: [đang thao tác liên tục, đang thao tác]
    symbols: [active_ms]
  - id: old_plane_new_plane
    term: old plane / new plane
    meaning: 'hai ảnh 1 bit gửi cho controller; mỗi pixel vẽ theo cặp bit (new, old).'
    avoid: [mặt phẳng cũ, mặt phẳng mới, mặt phẳng]
  - id: decision
    term: decision
    meaning: 'kết quả policy cho 1 frame: action, intent, window, old_plane.'
    avoid: [cách vẽ]

  # ---- HAL và driver ----
  - id: purpose
    term: purpose
    meaning: 'mục đích một lần vẽ (TEXT, UI, PAGE, CLEAN_*); display giữ 1 preset cho mỗi purpose.'
    avoid: [mục đích vẽ]
    symbols: [ink_hal_display_purpose_t]
  - id: preset
    term: preset
    meaning: 'cấu hình vẽ của 1 purpose: bands, draw config, debt_weight, marks_edges.'
    avoid: []
  - id: options
    term: options
    meaning: 'cấu hình display đổi được lúc chạy (presets, ngưỡng debt, thời gian cleanup stage).'
    avoid: [cài đặt]
    symbols: [ink_display_options_t]
  - id: capabilities
    term: capabilities
    meaning: 'struct driver khai báo nó làm được gì. Display: cỡ panel, x_align, profiles, purpose defaults. Button: has_interrupt.'
    avoid: [bảng khả năng]
    symbols: [ink_hal_display_capabilities_t]
  - id: profile
    term: profile
    meaning: 'bộ waveform và thông số nguồn nạp vào controller cho 1 lần vẽ.'
    avoid: []
  - id: waveform
    term: waveform
    meaning: '5 bảng LUT (LUTC, LUTWW, LUTKW, LUTWK, LUTKK) điều khiển điện áp từng pixel.'
    avoid: [bảng sóng]
  - id: lut_frame
    term: LUT frame
    meaning: 'một bước thời gian của waveform, dài 1 / (LUT frame rate do PLL đặt). Khác frame (ảnh). Ví dụ: 10 LUT frame ở 50 Hz = 200 ms.'
    avoid: []
  - id: band
    term: band
    meaning: 'dải nhiệt độ; nhiệt độ ≤ max_celsius thì dùng profile_id.'
    avoid: [dải nhiệt độ, dải]
  - id: analog_power
    term: analog power
    meaning: 'nguồn cao áp của controller, bật bằng PON, tắt bằng POF.'
    avoid: [nguồn analog]
  - id: drf
    term: DRF
    meaning: 'lệnh Display Refresh; panel quét 1 lần, BUSY thấp tới khi xong.'
    avoid: []
  - id: border
    term: border
    meaning: 'viền ngoài vùng hiển thị của panel.'
    avoid: [viền màn]
  - id: caller
    term: caller
    meaning: 'code gọi hàm đang nói tới.'
    avoid: [bên gọi]

  # ---- Kiến trúc chung ----
  - id: core_module
    term: core module
    meaning: 'module C thuần trong components/core/: không include ESP-IDF, có host test. Nhận event, trả action.'
    avoid: [khối lõi, lõi thuần, lõi]
  - id: shell_module
    term: shell module
    meaning: 'module bọc core module: giữ task, queue, lock, gọi driver; càng mỏng càng tốt.'
    avoid: [khối vỏ, vỏ mỏng, vỏ]
  - id: operations
    term: operations
    meaning: 'struct con trỏ hàm driver điền (ink_hal_*_operations_t); tầng trên chỉ gọi driver qua đây.'
    avoid: [bảng hàm]
  - id: device
    term: device
    meaning: 'operations + context + capabilities của một linh kiện; bsp tạo, tầng trên nhận qua ink_bsp_*().'
    avoid: []
  - id: pin_map
    term: pin map
    meaning: 'bảng chân GPIO của board trong ink_bsp.c; là dữ liệu, không dùng #define.'
    avoid: [bảng chân]

  # ---- Task và message (ink_system, ink_platform) ----
  - id: main_queue
    term: main queue
    meaning: 'FreeRTOS queue của main task, 32 message. ISR và helper task chỉ post message vào đây.'
    avoid: [hàng đợi task main, hàng đợi của task main, hàng đợi main, hàng đợi]
  - id: message
    term: message
    meaning: 'struct post vào main queue; system chuyển cho module owner (hiện chỉ input).'
    avoid: []
  - id: post
    term: post
    meaning: 'đẩy message vào main queue, không chờ; queue đầy thì message bị drop và được đếm.'
    avoid: []
  - id: interrupt
    term: interrupt
    meaning: 'GPIO interrupt khi chân nút đổi level; ISR nằm trong IRAM, không log, không chờ.'
    avoid: [ngắt nút, ngắt GPIO, bật ngắt, có ngắt, dịch vụ ngắt]
  - id: timer
    term: timer
    meaning: 'one-shot timer của platform (esp_timer); callback chạy trên task esp_timer nên chỉ được post message.'
    avoid: [hẹn giờ, bộ hẹn giờ]

  # ---- Input (ink_gesture, ink_keymap, ink_input) ----
  - id: edge
    term: edge
    meaning: 'một lần chân nút đổi level (bấm hoặc nhả), kèm timestamp. Vào gesture dưới dạng ink_gesture_event_t.'
    avoid: [cạnh nút, cạnh cuối, cạnh đầu tiên, mỗi cạnh, mất cạnh]
  - id: timestamp
    term: timestamp
    meaning: 'time_ms của edge; input đọc ink_platform_now_ms() trong ISR, nên chỉ có một nguồn giờ.'
    avoid: [đóng dấu thời gian, đóng dấu giờ]
  - id: bounce
    term: bounce
    meaning: 'chuỗi edge giả khi tiếp điểm nút rung lúc bấm hoặc nhả.'
    avoid: [chùm rung]
  - id: debounce
    term: debounce
    meaning: 'gesture nhận edge đầu tiên ngay, bỏ mọi edge trong debounce_ms sau đó, hết khoảng này thì so level cuối với level đã nhận.'
    avoid: [lọc rung, chống rung]
  - id: gesture
    term: gesture
    meaning: 'cặp (modifier, trigger) gesture nhận ra từ các edge; trigger = (source, button, type).'
    avoid: [cử chỉ]
    symbols: [ink_gesture_t]
  - id: modifier
    term: modifier
    meaning: 'nút đang giữ khi trigger bắt đầu (NONE, A, B); chỉ có khi nút đó bật WAIT_MODIFIER.'
    avoid: []
  - id: trigger
    term: trigger
    meaning: 'phần (source, button, type) của gesture. type: PRESS, DOUBLE_PRESS, HOLD, HOLD_AB_SHORT, HOLD_AB_LONG.'
    avoid: []
  - id: double_press
    term: double press
    meaning: 'gesture type DOUBLE_PRESS: bấm lần hai trong double_ms sau lần nhả.'
    avoid: [nhấn kép, bấm kép]
  - id: hold_ab
    term: hold A+B
    meaning: 'giữ cả A và B: HOLD_AB_SHORT (≥ ab_short_ms, về menu), HOLD_AB_LONG (≥ ab_long_ms, tắt nguồn). System xử lý; app không thấy, không gán được.'
    avoid: [giữ A+B ngắn, giữ A+B dài]
  - id: wait_mask
    term: wait mask
    meaning: 'bit các gesture type bắt một nút phải chờ: WAIT_DOUBLE (chờ double_ms sau nhả), WAIT_MODIFIER (HOLD chờ tới lúc nhả). Mặc định tắt.'
    avoid: [kiểu phải chờ, kiểu bắt phải chờ]
    symbols: [ink_gesture_wait_mask_t]
  - id: deadline
    term: deadline
    meaning: 'thời điểm gesture cần được tick tiếp: hết debounce, đủ hold_ms, hết double_ms, đủ ab_long_ms.'
    avoid: []
  - id: progress
    term: progress
    meaning: 'gesture đang giữ dở: on_release, type kế tiếp và lúc tới; system dùng để vẽ thanh đếm ngược.'
    avoid: [cử chỉ dở, gesture dở]
    symbols: [ink_gesture_progress, ink_gesture_progress_t]
  - id: gesture_config
    term: gesture config
    meaning: 'các ngưỡng thời gian của gesture (debounce_ms, double_ms, hold_ms, combo_ms, ab_short_ms, ab_long_ms); đổi được lúc chạy.'
    avoid: []
    symbols: [ink_gesture_config_t]
  - id: resync
    term: resync
    meaning: 'input đọc lại level thật của chân khi main queue rỗng, sau timer hoặc khi có message bị drop; khác level của edge cuối thì feed thêm một resync edge.'
    avoid: [đọc lại chân, edge bù, cạnh bù]
  - id: keymap_table
    term: keymap table
    meaning: 'danh sách entry {gesture, keymap intent}, tối đa INK_KEYMAP_ENTRY_MAX (32). App có app table; scene cần nghĩa riêng có thêm scene table, tra trước app table.'
    avoid: [bảng gán]
    symbols: [ink_keymap_table_t]
  - id: keymap_intent
    term: keymap intent
    meaning: 'lệnh keymap tra ra từ gesture rồi đưa cho app: NEXT, PREV, SELECT, BACK (0-3), mã riêng của app từ APP_BASE (16). Khác intent của display.'
    avoid: []
    symbols: [ink_keymap_intent_t]

  # ---- Wake session ----
  - id: deep_sleep
    term: deep sleep
    meaning: 'chế độ ngủ của ESP32-S3: mất RAM và PSRAM, giữ RTC memory; wake là boot lại từ đầu.'
    avoid: [ngủ sâu]
  - id: wake_session
    term: wake session
    meaning: 'một lần máy thức: boot, restore, active, save, deep sleep. State machine nằm trong session.'
    avoid: [phiên thức]
  - id: cold_boot
    term: cold boot
    meaning: 'boot khi vừa cấp điện, không phải wake từ deep sleep: không có snapshot, shown frame chưa biết.'
    avoid: [khởi động nguội]
  - id: snapshot
    term: snapshot
    meaning: 'state một module ghi vào RTC slot của nó trước deep sleep, đọc lại sau wake.'
    avoid: []
  - id: rtc_slot
    term: RTC slot
    meaning: 'vùng RTC memory cỡ cố định, có version, dành riêng cho một module.'
    avoid: [ô RTC memory, ô RTC]

  # ---- App ----
  - id: scene
    term: scene
    meaning: 'một màn của app, có cùng bộ hàm như app.'
    avoid: []
  - id: settings_app
    term: Settings
    meaning: 'app Cài đặt trên máy: đổi options, gesture config, keymap table; đọc ghi qua API của system.'
    avoid: [app Cài đặt]
  - id: scene_stack
    term: scene stack
    meaning: 'stack scene của app, tối đa 4 tầng; BACK pop về scene trước.'
    avoid: [ngăn xếp scene]

  # ---- UI (ink_ui) ----
  - id: canvas
    term: canvas
    meaning: 'ảnh 1 bit đúng bố cục frame (240 × 416 px, dọc); app vẽ theo app coordinates, canvas đổi sang toạ độ panel từng pixel.'
    avoid: []
    symbols: [ink_ui_canvas_t]
  - id: app_coordinates
    term: app coordinates
    meaning: 'toạ độ màn ngang 416 × 240 px, gốc góc trên trái, x sang phải, y xuống dưới.'
    avoid: [toạ độ app]
  - id: rotation
    term: rotation
    meaning: 'cách đổi app coordinates sang toạ độ panel: ROTATION_90 hoặc ROTATION_270, chọn lúc init canvas.'
    avoid: [hướng xoay]
  - id: glyph
    term: glyph
    meaning: 'bitmap và số đo của một ký tự trong font.'
    avoid: []
    symbols: [ink_ui_glyph_t]
  - id: baseline
    term: baseline
    meaning: 'đường chân chữ; offset_y của glyph và ascent của font tính từ đây.'
    avoid: [đường cơ sở]
